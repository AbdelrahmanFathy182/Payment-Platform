services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: ledger_service
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
     - ledger-data:/var/lib/postgresql/data
     - ./ledger-service/src/test/resources/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_service -d ledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  ledger-service:
    image: ledger-service:local
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ledger_db
      SPRING_DATASOURCE_USERNAME: ledger_service
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_FLYWAY_PASSWORD: flyway_pass

  psp-db:
    image: postgres:16
    environment:
      POSTGRES_DB: psp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
     - psp-data:/var/lib/postgresql/data
     - ./psp-simulator/src/test/resources/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d psp_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  psp-simulator:
    image: psp-simulator:local
    build: ./psp-simulator
    ports:
      - "8083:8083"
    depends_on:
      psp-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://psp-db:5432/psp_db
      SPRING_DATASOURCE_USERNAME: psp_service
      SPRING_DATASOURCE_PASSWORD: psp_pass
      SPRING_FLYWAY_USER: flyway_user
      SPRING_FLYWAY_PASSWORD: flyway_pass



volumes:
  ledger-data:
  psp-data:
