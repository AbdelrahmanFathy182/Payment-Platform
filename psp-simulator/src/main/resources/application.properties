spring.application.name=psp-simulator

server.port=8083

spring.flyway.user=flyway_user
spring.flyway.password=flyway_pass

spring.datasource.url=jdbc:postgresql://localhost:5432/psp_db
spring.datasource.username=psp_service
spring.datasource.password=psp_pass

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=readinessState,db

