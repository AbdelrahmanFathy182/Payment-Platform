spring.application.name=orchestrator
server.port=8082

spring.datasource.url=${ORCHESTRATOR_DB_URL:jdbc:postgresql://localhost:5432/orchestrator_db}
spring.datasource.username=${ORCHESTRATOR_DB_USER:orchestrator_service}
spring.datasource.password=${ORCHESTRATOR_DB_PASSWORD:orchestrator_pass}

spring.flyway.user=${ORCHESTRATOR_FLYWAY_USER:${ORCHESTRATOR_DB_USER:orchestrator_service}}
spring.flyway.password=${ORCHESTRATOR_FLYWAY_PASSWORD:${ORCHESTRATOR_DB_PASSWORD:orchestrator_pass}}

spring.jpa.hibernate.ddl-auto=validate

orchestrator.timing.fast-poll-interval=3s
orchestrator.timing.fast-poll-window=3m
orchestrator.timing.slow-poll-interval=15s
orchestrator.timing.hard-stop=24h
orchestrator.timing.payment-deadline=15m
orchestrator.timing.capture-delay=5s
orchestrator.timing.capture-alert=10m
orchestrator.timing.authorize-alert=15m
orchestrator.timing.void-alert=15m
orchestrator.timing.attempt-cap=3
orchestrator.timing.first-attempt-delay=10s
orchestrator.timing.second-attempt-delay=30s
orchestrator.timing.idempotency-ttl=24h

orchestrator.fee.rate=0.02
orchestrator.fee.rounding=HALF_UP
orchestrator.fee.account-id=${ORCHESTRATOR_FEE_ACCOUNT_ID:00000000-0000-0000-0000-000000000000}

orchestrator.credentials.client.username=${ORCHESTRATOR_CLIENT_USERNAME:orchestrator-client}
orchestrator.credentials.client.password=${ORCHESTRATOR_CLIENT_PASSWORD:orchestrator-client-pass}
orchestrator.credentials.psp.username=${ORCHESTRATOR_PSP_USERNAME:orchestrator-service}
orchestrator.credentials.psp.password=${ORCHESTRATOR_PSP_PASSWORD:orchestrator-service-pass}
orchestrator.credentials.ledger.username=${ORCHESTRATOR_LEDGER_USERNAME:orchestrator-service}
orchestrator.credentials.ledger.password=${ORCHESTRATOR_LEDGER_PASSWORD:orchestrator-service-pass}
