spring.application.name=ledger-service
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/ledger_db
spring.datasource.username=ledger_service
spring.datasource.password=ledger_pass


spring.flyway.user=flyway_user
spring.flyway.password=flyway_pass

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=readinessState,db


